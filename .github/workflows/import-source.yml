name: import-source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target
      - name: Checkout source flagship branch
        uses: actions/checkout@v4
        with:
          repository: ziqixu22/tableau-analytics-portfolio
          ref: llm-evaluation-rebuild
          path: source
      - name: Replace target contents with flagship project
        run: |
          find target -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' source/ target/
      - name: Commit imported project
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import LLM Evaluation & Release Decision Platform" || exit 0
          git push origin HEAD:main
